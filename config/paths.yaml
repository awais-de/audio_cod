# Dataset and Project Path Configuration
# This file is automatically resolved at runtime based on the project structure
# It enables idempotent setup across different systems and environments

# Dataset paths (relative to project root parent directory)
# The 'datasets' directory is a sibling to the 'audio_cod' project root
datasets:
  root: "datasets"  # Sibling directory under the project parent
  librispeech:
    root: "datasets/LibriSpeech"
    train_clean_100: "datasets/LibriSpeech/train-clean-100"
    test_clean: "datasets/LibriSpeech/test-clean"

# Checkpoint paths (relative to project root)
checkpoints:
  root: "checkpoints_emergency"
  v3_baseline: "checkpoints_emergency/pesq_balanced_v3_20260129_094112/best.pt"
  phase1: "checkpoints_emergency/phase1_multiscale_20260129_124452/best.pt"
  phase2: "checkpoints_emergency/phase2_perceptual_20260129_210723/best.pt"
  phase3: "checkpoints_emergency/phase3_extended_data_20260129_213522/best.pt"
  phase4: "checkpoints_emergency/phase4_adversarial_20260130_063348/best.pt"

# Script paths (relative to project root)
scripts:
  eval_testclean: "scripts/eval_testclean.py"
  eval_synthetic: "scripts/eval_synthetic.py"
  demo_server: "scripts/demo_server.py"
  demo_client: "scripts/demo_client.py"
  ams_codec: "scripts/ams_codec.py"

# Model configuration
model:
  d_model: 384
  n_layers: 6
  n_heads: 8
  hop_length: 160
  sample_rate: 16000
