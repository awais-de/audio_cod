# Neural Audio Codec Training Configuration

model:
  sample_rate: 16000        # Audio sample rate (Hz)
  hop_length: 160           # Hop length (10ms at 16kHz)
  d_model: 256              # Model embedding dimension (OPTIMIZED: reduced from 512)
  n_layers: 4               # Number of transformer layers (OPTIMIZED: reduced from 8)
  n_heads: 8                # Number of attention heads (OPTIMIZED: reduced from 16)
  window_size: 256          # Sliding window size for causal attention
  dropout: 0.1              # Dropout rate

training:
  epochs: 100               # Number of training epochs
  batch_size: 32            # Batch size (OPTIMIZED: increased from 4 for GPU efficiency)
  learning_rate: 0.0001     # Initial learning rate
  weight_decay: 0.01        # Weight decay for AdamW
  gradient_clip: 1.0        # Gradient clipping max norm
  
  # Loss weights
  l1_weight: 1.0            # Time-domain L1 loss weight
  spectral_weight: 1.0      # Multi-scale spectral loss weight
  
  # Data
  segment_length: 6000      # Audio segment length (OPTIMIZED: 0.375s - reduced from 8000)
  num_workers: 4            # DataLoader workers (OPTIMIZED: increased from 0)

data:
  train_dir: "/mnt/Data/muaw1874/datasets/LibriSpeech/train-clean-100"
  val_dir: "/mnt/Data/muaw1874/datasets/LibriSpeech/train-clean-100"
  extensions: ['.wav', '.flac', '.mp3']

checkpoint:
  dir: "checkpoints"        # Checkpoint directory
  save_every: 10            # Save checkpoint every N epochs

# Optimization Summary:
# Model Parameters: Reduced from 51.8M to ~12M
#   - d_model: 512 -> 256 (2x reduction)
#   - n_layers: 8 -> 4 (2x reduction)
#   - n_heads: 16 -> 8 (2x reduction)
#
# Training Speed: Expected 5-7x speedup from original
#   - Batch Size: 4 -> 32 (GPU memory efficiency)
#   - Segment Length: 8000 -> 6000 (shorter sequences)
#   - num_workers: 0 -> 4 (parallel data loading)
#   - Fewer model parameters: 51.8M -> 12M
#
# Memory: Reduced from ~40GB to ~8-12GB per GPU
